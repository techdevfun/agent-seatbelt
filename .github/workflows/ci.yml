name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + acceptance harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install OPA v1.21.3 (pinned, sha256-verified)
        run: |
          curl -sL --fail -o /tmp/opa https://openpolicyagent.org/downloads/v1.21.3/opa_linux_amd64_static
          echo "add7c9dcf56e1ce1538426a6ee595ea1cc7ee830bbedd4c23219825b02b19a79  /tmp/opa" | sha256sum -c -
          chmod +x /tmp/opa
          /tmp/opa version
      - name: Unit tests
        env:
          SEATBELT_OPA_BIN: /tmp/opa
        run: python3 -m unittest discover -s tests -v
      - name: Acceptance harness (both adapters, clean + planted)
        env:
          SEATBELT_OPA_BIN: /tmp/opa
        run: python3 verification/run_acceptance.py
      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-results
          path: |
            verification/results.md
            verification/results.json
            verification/work/claude-code-clean/transcript.json
            verification/work/claude-code-planted/transcript.json
            verification/work/openshell-clean/transcript.json
            verification/work/openshell-planted/transcript.json
            verification/work/openshell-clean/reconciliation.json
            verification/work/openshell-planted/reconciliation.json
          if-no-files-found: ignore

  scans:
    name: Release scans (public content + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Public-content sweep (factory Standing Rule 7)
        run: python3 scripts/check_public_content.py .
      - name: gitleaks v8.30.1 (pinned, sha256-verified)
        run: |
          curl -sL --fail -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir --redact --exit-code 1 .
